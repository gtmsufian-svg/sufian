/* ==========================================================
   Sufian portfolio - living nature theme
   Palette: sky #bfe3f7 | forest ink #17331f | leaf #3f7d3a
            moss #5f9e3f | bark #6b4a2f | sun #f5b83d
   Fonts:   Fraunces (headings), Nunito Sans (body)
   ========================================================== */

:root {
  --ink: #0f2616;
  --ink-soft: #26402e;
  --leaf: #3f7d3a;
  --leaf-dark: #2a5a2a;
  --moss: #5f9e3f;
  --bark: #6b4a2f;
  --sun: #f5b83d;
  --sun-ink: #3a2a05;
  --glass: rgba(255, 255, 255, 0.76);
  --glass-border: rgba(255, 255, 255, 0.8);
  --shadow: 0 10px 30px rgba(23, 51, 31, 0.14);
  --radius: 20px;
  --font-head: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 1.05rem;
  line-height: 1.65;
  color: var(--ink);
  background: #bfe3f7;
  min-height: 100vh;
  font-weight: 600;
  text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 8px rgba(255, 255, 255, 0.95), 0 0 14px rgba(255, 255, 255, 0.8);
  animation: page-in 0.7s ease both;
}

body.is-stormy {
  color: #07140b;
  text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 6px #fff, 0 0 10px #fff, 0 0 18px rgba(255, 255, 255, 0.95);
}

/* yellow highlighter for the important words */
.mark {
  background: #ffe45c;
  color: #1a1400;
  padding: 0.04em 0.35em;
  border-radius: 0.3em;
  font-weight: 800;
  text-shadow: none;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes page-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

h1, h2, h3 {
  font-family: var(--font-head);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
}

p { margin: 0; }

a { color: var(--leaf-dark); }

img { max-width: 100%; display: block; }

[hidden] { display: none !important; }

:focus-visible {
  outline: 3px solid #1b4fd8;
  outline-offset: 3px;
  border-radius: 6px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 100;
  background: #fff;
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 700;
  transition: top 0.2s;
}
.skip-link:focus { top: 12px; }

/* ---------- sky canvas ---------- */
#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}

/* ---------- glass surface ---------- */
.glass {
  background: transparent;
  border: none;
  box-shadow: none;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

main,
.site-header,
.site-footer {
  position: relative;
  z-index: 1;
}

/* the soil of the skills page runs edge to edge, so hide anything that sticks out sideways */
main {
  overflow-x: hidden;
  overflow-x: clip;
}

/* ---------- header / nav ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 12px 20px 0;
  transition: transform 0.35s ease;
}

.site-header.nav-hidden {
  transform: translateY(-140%);
}

.site-header.is-scrolled .nav {
  box-shadow: 0 8px 24px rgba(15, 38, 22, 0.18);
  background: rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.nav {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 14px 10px 24px;
  border-radius: 999px;
  position: relative;
}

.brand {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.4rem;
  text-decoration: none;
  color: var(--ink);
}

.nav-links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 4px;
}

.nav-link {
  display: block;
  padding: 8px 16px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.97rem;
  color: var(--ink);
  transition: background 0.2s, color 0.2s;
}

.nav-link:hover {
  background: rgba(63, 125, 58, 0.14);
  color: var(--ink);
}

.nav-link[aria-current="page"] {
  background: transparent;
  color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--leaf-dark);
}

.nav-toggle {
  display: none;
  font: inherit;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 999px;
  border: 2px solid var(--leaf);
  background: transparent;
  color: var(--leaf-dark);
  cursor: pointer;
}

/* ---------- buttons (outline only) ---------- */
.btn {
  display: inline-block;
  font: inherit;
  font-weight: 800;
  text-decoration: none;
  padding: 12px 26px;
  border-radius: 14px;
  border: 2px solid var(--leaf-dark);
  background: transparent;
  color: var(--leaf-dark);
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.55);
  transform: translateY(-2px);
}

.btn-ghost {
  border-color: rgba(23, 51, 31, 0.5);
  border-style: dashed;
}

.btn-small {
  padding: 8px 18px;
  font-size: 0.95rem;
}

.btn-wa {
  border-color: #1f7a4a;
  color: #1f7a4a;
}

.muted {
  color: var(--ink-soft);
  font-size: 0.95rem;
}

/* ---------- page layout ---------- */
.page {
  padding: 36px 0 110px;
}

.page-head {
  padding: 28px 32px;
  border-radius: var(--radius);
  margin-bottom: 28px;
  max-width: 760px;
}

.page-head h1 {
  font-size: clamp(2rem, 4.5vw, 3rem);
}

.page-head p {
  margin-top: 10px;
  color: var(--ink-soft);
  max-width: 62ch;
}

/* ---------- home hero ---------- */
.hero {
  min-height: calc(100vh - 110px);
  display: flex;
  align-items: center;
  padding: 24px 0 110px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 40px;
  align-items: center;
}

.hero-card {
  padding: 40px 44px;
  border-radius: 28px;
}

.hero-card h1 {
  font-size: clamp(2.5rem, 6vw, 4.3rem);
  letter-spacing: -0.02em;
}

.hero-title {
  margin-top: 12px;
  font-family: var(--font-head);
  font-weight: 500;
  font-size: clamp(1.1rem, 2.3vw, 1.45rem);
  line-height: 1.35;
  color: var(--ink-soft);
}

.trial {
  margin-top: 20px;
  font-size: 1.2rem;
}

.trial .mark {
  padding: 0.2em 0.6em;
}

.hero-text {
  margin-top: 20px;
  max-width: 56ch;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 26px;
}

.social {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 26px;
}

.social-link {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--leaf);
  font-weight: 700;
  font-size: 0.92rem;
  text-decoration: none;
  color: var(--leaf-dark);
  transition: background 0.2s, color 0.2s;
}

a.social-link:hover {
  background: var(--leaf);
  color: #fff;
}

.social-link.is-empty {
  border-style: dashed;
  border-color: rgba(23, 51, 31, 0.6);
  color: rgba(23, 51, 31, 0.75);
  cursor: default;
}

.hero-photo {
  display: flex;
  justify-content: center;
}

.photo-frame {
  width: clamp(200px, 26vw, 300px);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.9);
  background: transparent;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 24px rgba(255, 255, 255, 0.4);
  display: grid;
  place-items: center;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
}

.photo-initial {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 5.5rem;
  color: var(--ink);
}

/* ---------- cards ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 20px;
}

.card {
  padding: 24px;
  border-radius: var(--radius);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.card-title {
  font-size: 1.25rem;
}

.card-text {
  margin-top: 10px;
  color: var(--ink-soft);
}

.badge-free {
  flex: none;
  padding: 3px 12px;
  border-radius: 999px;
  background: #ffe45c;
  color: #1a1400;
  text-shadow: none;
  font-weight: 800;
  font-size: 0.85rem;
}

.banner {
  margin-top: 28px;
  padding: 24px 28px;
  border-radius: var(--radius);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.banner p {
  font-size: 1.1rem;
}

/* ---------- about ---------- */
.about-grid {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  gap: 22px;
  align-items: start;
}

.about-text {
  padding: 30px 32px;
  border-radius: var(--radius);
}

.about-text p + p { margin-top: 14px; }

.facts {
  padding: 26px 28px;
  border-radius: var(--radius);
}

.facts dl { margin: 0; }
.facts dt {
  font-weight: 800;
  margin-top: 16px;
}
.facts dt:first-child { margin-top: 0; }
.facts dd {
  margin: 2px 0 0;
  color: var(--ink-soft);
}

.facts .btn { margin-top: 20px; }

/* ---------- projects ---------- */
.project-media {
  height: 160px;
  border-radius: 14px;
  overflow: hidden;
  background: transparent;
  border: none;
  display: grid;
  place-items: center;
  margin-bottom: 16px;
}

.project-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-media-text {
  color: var(--ink-soft);
  font-weight: 700;
}

.review {
  margin: 16px 0 0;
  padding-left: 14px;
  border-left: 4px solid var(--moss);
}

.review.is-empty .review-text {
  color: var(--ink-soft);
  font-style: italic;
}

.review-text { font-size: 0.98rem; }
.review-by { margin-top: 4px; font-weight: 700; font-size: 0.9rem; }

.card-actions { margin-top: 18px; }

/* ---------- skills tree ---------- */
.tree-wrap {
  max-width: 1100px;
  margin: 24px auto 0;
}

#tree svg {
  overflow: visible;
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
}

.leaf {
  cursor: pointer;
  outline: none;
}

.leaf .blade {
  fill: url(#leaf-grad);
  stroke: var(--leaf-dark);
  stroke-width: 2;
  transition: fill 0.2s;
}

.leaf:hover .blade,
.leaf:focus-visible .blade {
  fill: url(#leaf-grad-hover);
}

.leaf.is-open .blade {
  fill: url(#leaf-grad-sel);
  stroke: #1d4a1d;
  stroke-width: 3;
}

.leaf:focus-visible .blade {
  stroke: #1b4fd8;
  stroke-width: 4;
}

.leaf-inner {
  transform-box: fill-box;
  transform-origin: 0% 50%;
}

.leaf:hover .leaf-inner,
.leaf:focus-visible .leaf-inner {
  animation: sway 0.9s ease-in-out;
}

@keyframes sway {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(7deg); }
  50% { transform: rotate(-6deg); }
  75% { transform: rotate(3deg); }
  100% { transform: rotate(0deg); }
}

.leaf-text {
  font-family: var(--font-body);
  font-weight: 800;
  fill: #fff;
  text-shadow: none;
  paint-order: stroke;
  stroke: rgba(20, 50, 20, 0.55);
  stroke-width: 2px;
  pointer-events: none;
}

/* the two halves of a leaf slide apart when it is opened */
.half {
  transform-box: fill-box;
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.half-top { transform-origin: 0% 100%; }
.half-bottom { transform-origin: 0% 0%; }

.leaf.is-open .half-top {
  transform: translateY(calc(var(--d, 60px) * -1)) rotate(-8deg);
}

.leaf.is-open .half-bottom {
  transform: translateY(var(--d, 60px)) rotate(8deg);
}

.leaf.is-open .leaf-inner { animation: none; }

/* leaves on the left side are joined to the trunk at their right tip */
.leaf.from-right .leaf-inner { transform-origin: 100% 50%; }
.leaf.from-right .half-top { transform-origin: 100% 100%; }
.leaf.from-right .half-bottom { transform-origin: 100% 0%; }
.leaf.from-right.is-open .half-top {
  transform: translateY(calc(var(--d, 60px) * -1)) rotate(8deg);
}
.leaf.from-right.is-open .half-bottom {
  transform: translateY(var(--d, 60px)) rotate(-8deg);
}

.leaf-text { transition: opacity 0.2s; }
.leaf.is-open .leaf-text { opacity: 0; }

/* the popup that opens in the middle of the screen */
.skill-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(15, 38, 22, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.skill-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.skill-modal {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 41;
  width: min(460px, 90vw);
  box-sizing: border-box;
  padding: 24px 58px 24px 26px;
  border-radius: 22px;
  background: rgba(246, 252, 239, 0.98);
  border: none;
  box-shadow: 0 22px 54px rgba(15, 38, 22, 0.4);
  color: var(--ink);
  text-shadow: none;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -46%) scale(0.9);
  transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.skill-modal.show {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.skill-modal-title {
  font-family: var(--font-head);
  font-size: 1.5rem;
  line-height: 1.2;
}

.skill-modal-text {
  margin-top: 10px;
  font-size: 1.05rem;
  color: var(--ink-soft);
  font-weight: 600;
}

.skill-close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--leaf-dark);
  background: transparent;
  color: var(--leaf-dark);
  font: inherit;
  font-size: 1.1em;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
}

.skill-close:hover { background: rgba(63, 125, 58, 0.15); }

.level {
  margin-top: 14px;
  height: 12px;
  border-radius: 999px;
  background: transparent;
  border: 1.5px solid var(--leaf-dark);
  overflow: hidden;
}
.level-fill {
  height: 100%;
  background: var(--leaf);
  border-radius: 999px;
}
.level-text { margin-top: 6px; font-weight: 700; font-size: 0.92rem; }

/* ---------- contact ---------- */
.contact-grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 22px;
  align-items: start;
}

.contact-info,
.contact-form {
  padding: 28px 30px;
  border-radius: var(--radius);
}

.contact-info dl { margin: 0; }
.contact-info dt { font-weight: 800; margin-top: 18px; }
.contact-info dt:first-child { margin-top: 0; }
.contact-info dd { margin: 2px 0 0; }
.contact-info .social { margin-top: 8px; }

.contact-form h2 { font-size: 1.5rem; margin-bottom: 16px; }

.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-weight: 800;
  margin-bottom: 6px;
}

.field input,
.field textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid rgba(23, 51, 31, 0.65);
  background: transparent;
}

.field input::placeholder,
.field textarea::placeholder {
  color: var(--ink-soft);
  opacity: 0.8;
}

.field textarea { min-height: 140px; resize: vertical; }

.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--leaf-dark);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8);
}

.field-error {
  min-height: 1.2em;
  margin-top: 4px;
  color: #a32d2d;
  font-weight: 700;
  font-size: 0.92rem;
}

.form-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.form-status {
  margin-top: 14px;
  font-weight: 700;
  color: var(--leaf-dark);
}

/* ---------- footer ---------- */
.site-footer {
  padding: 0 24px 28px;
}

.footer-box {
  max-width: 1100px;
  margin: 0 auto;
  text-align: right;
  font-size: 0.78rem;
  color: var(--ink-soft);
}

/* ---------- sound button ---------- */
.brand-group {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sound-slot { display: inline-flex; }

.sound-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font: inherit;
  font-weight: 800;
  font-size: 0.85rem;
  color: var(--ink);
  background: transparent;
  cursor: pointer;
  transition: transform 0.2s;
}

.sound-btn svg { width: 18px; height: 18px; }
.sound-btn:hover { transform: translateY(-1px); }
.sound-btn[disabled] { cursor: default; opacity: 0.7; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .nav-toggle { display: inline-block; }

  .nav-links {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    flex-direction: column;
    gap: 4px;
    padding: 12px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.96);
    border: none;
    box-shadow: var(--shadow);
  }

  .nav-links.is-open { display: flex; }
  .nav-link { padding: 12px 16px; }

  .hero-grid,
  .about-grid,
  .contact-grid {
    grid-template-columns: 1fr;
  }

  .hero-photo { order: -1; }
  .hero-card { padding: 28px 24px; }
  .hero { padding-top: 8px; }
}

@media (max-width: 520px) {
  .nav { padding-left: 18px; }
  .page-head { padding: 22px; }
  .about-text,
  .facts,
  .contact-info,
  .contact-form { padding: 22px; }
  .sound-btn span { display: none; }
  .sound-btn { padding: 7px; }
  .brand-group { gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}


/* skills page: the soil reaches the bottom of the page, the footer sits on it */
body[data-page="skills"] .page { padding-bottom: 0; }
body[data-page="skills"] .tree-wrap { margin-bottom: 0; }
body[data-page="skills"] .site-footer { margin-top: -58px; padding-bottom: 14px; }
body[data-page="skills"] .footer-box {
  color: #f6f2e4;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}

  <script>
/* ==========================================================
   Shared living sky: clouds, sun, rain, rainbow, birds,
   falling leaves, hills and trees. Used by every page.
   The weather state is kept in sessionStorage so the sky
   continues smoothly when you move from page to page.
   ========================================================== */
(function () {
  'use strict';

  var canvas = document.getElementById('sky');
  if (!canvas || !canvas.getContext) { return; }
  var ctx = canvas.getContext('2d');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- settings ---------- */
  var ORDER = ['sunny', 'cloudy', 'rain', 'clearing'];
  var DURATION = { sunny: 26, cloudy: 12, rain: 18, clearing: 14 };
  var TARGET = {
    sunny:    { dark: 0,    rain: 0, sun: 1,    rainbow: 0 },
    cloudy:   { dark: 0.92, rain: 0, sun: 0.05, rainbow: 0 },
    rain:     { dark: 1,    rain: 1, sun: 0,    rainbow: 0 },
    clearing: { dark: 0.15, rain: 0, sun: 1,    rainbow: 1 }
  };
  var TAU = { dark: 1.8, rain: 1.2, sun: 2.0, rainbow: 2.5 };
  var STORE_KEY = 'portfolio-weather';

  var TOP_CLEAR = [120, 198, 240];
  var BOT_CLEAR = [228, 245, 252];
  var TOP_DARK = [102, 118, 133];
  var BOT_DARK = [176, 188, 198];

  var HILLS = [
    { base: 0.80, amp: 0.035, f: 1.3, ph: 0.5, col: [156, 197, 138] },
    { base: 0.86, amp: 0.040, f: 0.9, ph: 2.2, col: [111, 166, 90] },
    { base: 0.93, amp: 0.030, f: 1.6, ph: 4.1, col: [63, 125, 58] }
  ];
  var TREES = [
    { x: 0.035, h: 1, s: 1.0,  seed: 3,  kind: 0 },
    { x: 0.10,  h: 2, s: 0.72, seed: 8,  kind: 1 },
    { x: 0.915, h: 2, s: 0.8,  seed: 15, kind: 1 },
    { x: 0.975, h: 1, s: 1.1,  seed: 21, kind: 0 }
  ];
  var PUFFS = [[0, 0, 34], [32, 7, 26], [-32, 9, 24], [60, 14, 18], [-58, 14, 18]];
  var LEAF_COLORS = ['#5f9e3f', '#8cc152', '#e8a33d', '#d9822b', '#7bb662'];
  var RAINBOW = [
    [255, 99, 99], [255, 169, 77], [255, 224, 102], [140, 231, 154],
    [116, 192, 252], [151, 117, 250], [229, 153, 247]
  ];

  /* ---------- state ---------- */
  var W = 0, H = 0, DPR = 1;
  var clock = 0;
  var state = 'sunny';
  var stateStart = Date.now();
  var amt = { dark: 0, rain: 0, sun: 1, rainbow: 0 };
  var clouds = [], leaves = [], flocks = [], drops = [];
  var birdTimer = 2;
  var bolts = [], lightningTimer = 2, thunderCbs = [], treeSprites = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

    return function () {

      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(a, b, t) {
    return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
  }
  function rgb(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')';
  }

  /* ---------- weather state (kept across pages) ---------- */
  function saveState() {
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ s: state, t: stateStart })); } catch (e) { /* ignore */ }
  }

  function loadState() {
    if (reduce) {
      state = 'sunny';
      stateStart = Date.now();
    } else {
      var saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(STORE_KEY)); } catch (e) { saved = null; }
      var now = Date.now();
      if (saved && DURATION[saved.s] && typeof saved.t === 'number') {
        state = saved.s;
        stateStart = saved.t;
      } else {
        state = 'sunny';
        stateStart = now - rand(0, 8000);
      }
      var guard = 0;
      while ((now - stateStart) / 1000 >= DURATION[state] && guard < 60) {
        stateStart += DURATION[state] * 1000;
        state = ORDER[(ORDER.indexOf(state) + 1) % ORDER.length];
        guard++;
      }
    }
    var t = TARGET[state];
    amt.dark = t.dark; amt.rain = t.rain; amt.sun = t.sun; amt.rainbow = t.rainbow;
    saveState();
  }

  function currentWind() {
    return 0.35 + 0.2 * Math.sin(clock * 0.35) + 0.25 * amt.rain;
  }

  /* ---------- actors ---------- */
  function makeClouds() {
    clouds = [];
    var n = W < 640 ? 5 : 8;
    for (var i = 0; i < n; i++) {
      clouds.push({ x: rand(-150, W + 150), y: H * rand(0.05, 0.37), s: rand(0.7, 1.6), v: rand(5, 14) });
    }
  }

  function newLeaf(anywhere) {
    return {
      x: rand(0, W),
      y: anywhere ? rand(0, H) : rand(-80, -20),
      s: rand(5, 9),
      vy: rand(24, 52),
      amp: rand(14, 48),
      fr: rand(0.5, 1.4),
      ph: rand(0, 6.28),
      rot: rand(0, 6.28),
      rs: rand(-1.1, 1.1),
      col: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)]
    };
  }

  function makeLeaves() {
    leaves = [];
    var n = W < 640 ? 14 : 22;
    for (var i = 0; i < n; i++) { leaves.push(newLeaf(true)); }
  }

  function makeDrops() {
    drops = [];
    var n = W < 640 ? 90 : 150;
    for (var i = 0; i < n; i++) {
      drops.push({ x: rand(-50, W + 50), y: rand(0, H), len: rand(10, 18), v: rand(520, 760) });
    }
  }

  function spawnFlock() {
    var dir = Math.random() < 0.5 ? 1 : -1;
    var count = 3 + Math.floor(Math.random() * 4);
    var birds = [];
    var span = 0;
    for (var i = 0; i < count; i++) {
      var side = i % 2 === 0 ? 1 : -1;
      var step = Math.ceil(i / 2);
      var ox = step * 28;
      birds.push({ ox: ox, oy: side * step * 11, size: rand(7, 10), phase: rand(0, 6.28) });
      if (ox > span) { span = ox; }
    }
    flocks.push({
      dir: dir,
      x: dir > 0 ? -30 : W + 30,
      y: H * rand(0.1, 0.38),
      v: rand(55, 95),
      span: span + 30,
      birds: birds
    });
  }

  function spawnBolt() {
    var x = rand(W * 0.12, W * 0.88);
    var y = H * rand(0.08, 0.2);
    var endY = H * rand(0.55, 0.75);
    var steps = 9;
    var pts = [[x, y]];
    var i;
    for (i = 1; i <= steps; i++) {
      pts.push([pts[i - 1][0] + rand(-38, 38), y + (endY - y) * i / steps]);
    }
    var bi = 3 + Math.floor(Math.random() * 3);
    var dir = Math.random() < 0.5 ? -1 : 1;
    var branch = [[pts[bi][0], pts[bi][1]]];
    for (i = 1; i <= 4; i++) {
      branch.push([branch[i - 1][0] + dir * rand(10, 30), branch[i - 1][1] + rand(25, 50)]);
    }
    bolts.push({ pts: pts, branch: branch, t: 0, dur: 0.5 });
    for (i = 0; i < thunderCbs.length; i++) {
      try { thunderCbs[i](); } catch (e) { /* ignore */ }
    }
  }

  function boltIntensity(t) {
    if (t < 0.07) { return 1; }
    if (t < 0.13) { return 0.15; }
    if (t < 0.22) { return 0.9; }
    return Math.max(0, 1 - (t - 0.22) / 0.28);
  }

  /* ---------- update ---------- */
  function ease(key, dt) {
    var target = TARGET[state][key];
    var k = 1 - Math.exp(-dt / TAU[key]);
    amt[key] += (target - amt[key]) * k;
  }

  function update(dt) {
    clock += dt;

    if (!reduce) {
      var elapsed = (Date.now() - stateStart) / 1000;
      if (elapsed >= DURATION[state]) {
        stateStart = Date.now();
        state = ORDER[(ORDER.indexOf(state) + 1) % ORDER.length];
        saveState();
      }
      ease('dark', dt); ease('rain', dt); ease('sun', dt); ease('rainbow', dt);
    }
    if (document.body) { document.body.classList.toggle('is-stormy', amt.dark > 0.55); }

    var wind = currentWind();
    var i;

    if (!reduce) {
      var sinceStart = (Date.now() - stateStart) / 1000;
      if (state === 'cloudy' || (state === 'rain' && sinceStart < 6)) {
        lightningTimer -= dt;
        if (lightningTimer <= 0) {
          spawnBolt();
          lightningTimer = rand(1.8, 4.2);
        }
      }
      for (i = bolts.length - 1; i >= 0; i--) {
        bolts[i].t += dt;
        if (bolts[i].t > bolts[i].dur) { bolts.splice(i, 1); }
      }
    }

    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x += c.v * dt * (1 + wind * 0.5);
      if (c.x > W + 170) { c.x = -170; c.y = H * rand(0.05, 0.37); }
    }

    for (i = 0; i < leaves.length; i++) {
      var l = leaves[i];
      l.y += l.vy * (1 - 0.3 * amt.rain) * dt;

    birdTimer -= dt;
    if (birdTimer <= 0) {
      if (amt.rain < 0.2 && amt.dark < 0.8) { spawnFlock(); }
      birdTimer = rand(9, 19);
    }
    for (i = flocks.length - 1; i >= 0; i--) {
      var f = flocks[i];
      f.x += f.dir * f.v * dt;
      if ((f.dir > 0 && f.x - f.span > W + 30) || (f.dir < 0 && f.x + f.span < -30)) {

      for (i = 0; i < drops.length; i++) {
        var d = drops[i];
        d.y += d.v * dt;

  }

  /* ---------- drawing ---------- */
  function drawSky() {
    var top = mix(TOP_CLEAR, TOP_DARK, amt.dark);
    var bot = mix(BOT_CLEAR, BOT_DARK, amt.dark);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSun() {
    if (amt.sun < 0.02) { return; }
    var R = Math.max(30, Math.min(W, H) * 0.05);
    var x = W * 0.84;
    var y = Math.max(70, H * 0.16);
    var g = ctx.createRadialGradient(x, y, R * 0.4, x, y, R * 5);
    g.addColorStop(0, 'rgba(255,238,160,' + (0.85 * amt.sun) + ')');
    g.addColorStop(1, 'rgba(255,238,160,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - R * 5, y - R * 5, R * 10, R * 10);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(clock * 0.08);
    ctx.strokeStyle = 'rgba(255,214,90,' + (0.45 * amt.sun) + ')';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (var i = 0; i < 14; i++) {
      ctx.rotate(Math.PI * 2 / 14);
      ctx.beginPath();
      ctx.moveTo(R * 1.35, 0);
      ctx.lineTo(R * (1.75 + 0.2 * Math.sin(clock * 1.5 + i)), 0);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(255,213,74,' + amt.sun + ')';
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRainbow() {
    if (amt.rainbow < 0.02) { return; }
    var cx = W * 0.6;
    var cy = H * 0.95;
    var R0 = Math.min(W * 0.46, H * 0.82);
    var bw = Math.max(7, Math.min(14, W / 90));

    ctx.lineCap = 'butt';

      ctx.strokeStyle = rgb(RAINBOW[i], 0.5 * amt.rainbow);
      ctx.beginPath();
      ctx.arc(cx, cy, R0 - i * bw, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawClouds() {
    var col = mix([255, 255, 255], [128, 140, 152], amt.dark);
    var alpha = 0.94 - 0.1 * amt.dark;
    ctx.fillStyle = rgb(col, alpha);
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      for (var j = 0; j < PUFFS.length; j++) {
        var p = PUFFS[j];
        var px = c.x + p[0] * c.s;
        var py = c.y + p[1] * c.s;
        var pr = p[2] * c.s;
        ctx.moveTo(px + pr, py);
        ctx.arc(px, py, pr, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }

  function drawBirds() {
    if (reduce) { return; }
    ctx.strokeStyle = 'rgba(40,55,48,' + (0.85 * (1 - amt.rain)) + ')';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < flocks.length; i++) {
      var f = flocks[i];
      for (var j = 0; j < f.birds.length; j++) {
        var b = f.birds[j];
        var bx = f.x - f.dir * b.ox;
        var by = f.y + b.oy + Math.sin(clock * 1.2 + b.phase) * 4;
        var s = b.size;
        var flap = Math.sin(clock * 9 + b.phase) * s * 0.8;
        ctx.beginPath();
        ctx.moveTo(bx - s * 1.4, by - flap * 0.6);
        ctx.quadraticCurveTo(bx - s * 0.5, by - s * 0.5 - flap, bx, by);
        ctx.quadraticCurveTo(bx + s * 0.5, by - s * 0.5 - flap, bx + s * 1.4, by - flap * 0.6);
        ctx.stroke();
      }
    }
  }

  function hillY(h, x) {
    return H * (h.base + h.amp * Math.sin(x / W * Math.PI * 2 * h.f + h.ph) +
      h.amp * 0.5 * Math.sin(x / W * Math.PI * 5 * h.f + h.ph * 2));
  }

  function drawHills() {
    for (var i = 0; i < HILLS.length; i++) {
      var h = HILLS[i];
      var darker = [(h.col[0] * 0.7) | 0, (h.col[1] * 0.78) | 0, (h.col[2] * 0.78) | 0];
      ctx.fillStyle = rgb(mix(h.col, darker, amt.dark));
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 12) { ctx.lineTo(x, hillY(h, x)); }
      ctx.lineTo(W, hillY(h, W));
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---------- realistic trees: drawn once to a sprite, then reused ---------- */
  function makeTreeSprite(t) {

    var k = Math.max(0.7, Math.min(1.3, W / 1100));

    var px = ts * Math.min(DPR, 1.5);
    var c = document.createElement('canvas');
    c.width = Math.ceil(uw * px);
    c.height = Math.ceil(uh * px);

    var by = uh - 6;
    var tips = [];

    /* ground shadow and root flare */
    g.fillStyle = 'rgba(20,40,20,0.22)';
    g.beginPath();
    g.ellipse(bx + 8, by + 2, 52, 7, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#4a3220';
    g.beginPath();
    g.moveTo(bx - 9, by - 22);
    g.quadraticCurveTo(bx - 12, by - 4, bx - 30, by + 2);
    g.lineTo(bx + 30, by + 2);
    g.quadraticCurveTo(bx + 12, by - 4, bx + 9, by - 22);
    g.closePath();
    g.fill();

    var ratio = t.kind === 0 ? 0.72 : 0.78;
    var spread = t.kind === 0 ? 0.55 : 0.34;

    function branch(x, y, ang, len, wid, depth) {
      var x2 = x + Math.cos(ang) * len;
      var y2 = y + Math.sin(ang) * len;
      var w2 = wid * 0.68;
      var nx = -Math.sin(ang);
      var ny = Math.cos(ang);
      g.fillStyle = depth > 2 ? '#58391f' : '#4a3220';
      g.beginPath();
      g.moveTo(x + nx * wid / 2, y + ny * wid / 2);
      g.lineTo(x2 + nx * w2 / 2, y2 + ny * w2 / 2);
      g.lineTo(x2 - nx * w2 / 2, y2 - ny * w2 / 2);
      g.lineTo(x - nx * wid / 2, y - ny * wid / 2);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(190,150,104,0.35)';
      g.lineWidth = Math.max(0.6, wid * 0.18);
      g.beginPath();
      g.moveTo(x - nx * wid * 0.22, y - ny * wid * 0.22);
      g.lineTo(x2 - nx * w2 * 0.22, y2 - ny * w2 * 0.22);
      g.stroke();
      if (depth <= 3) { tips.push([x2, y2]); }
      if (depth <= 0 || len < 9) { return; }
      var n = depth > 3 ? 2 : (rnd() < 0.5 ? 2 : 3);
      for (var i = 0; i < n; i++) {
        var side = n === 2 ? (i === 0 ? -1 : 1) : (i - 1);
        var off = side * (spread + rnd() * 0.25) + (rnd() - 0.5) * 0.15;
        branch(x2, y2, ang + off, len * (ratio + rnd() * 0.08), w2, depth - 1);
      }
    }

    var trunkLen = t.kind === 0 ? 62 : 60;
    branch(bx, by - 18, -Math.PI / 2 + (rnd() - 0.5) * 0.12, trunkLen, 20, 5);
    if (!tips.length) { tips.push([bx, by - 120]); }

    function clump(x, y, r, col) {
      g.fillStyle = col;
      for (var i = 0; i < 6; i++) {
        var a = rnd() * 6.283;
        var d = rnd() * r * 0.7;
        var rr = r * (0.45 + rnd() * 0.25);
        g.beginPath();
        g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rr, 0, 6.283);
        g.fill();
      }
    }

    var passes = [
      { n: 60, r: [13, 21], col: 'rgb(38,86,40)',   dx: 0,  dy: 3 },
      { n: 70, r: [10, 17], col: 'rgb(64,120,50)',  dx: -2, dy: -1 },
      { n: 56, r: [7, 12],  col: 'rgb(104,160,66)', dx: -4, dy: -4 },
      { n: 30, r: [4, 8],   col: 'rgb(150,192,84)', dx: -6, dy: -6 }
    ];
    passes.forEach(function (p) {
      for (var i = 0; i < p.n; i++) {
        var tip = tips[Math.floor(rnd() * tips.length)];
        var r = p.r[0] + rnd() * (p.r[1] - p.r[0]);
        clump(tip[0] + (rnd() - 0.5) * 34 + p.dx, tip[1] + (rnd() - 0.5) * 30 + p.dy, r, p.col);
      }
    });

    /* darker copy used while it rains */
    var d = document.createElement('canvas');
    d.width = c.width;
    d.height = c.height;
    var dg = d.getContext('2d');
    dg.drawImage(c, 0, 0);
    dg.globalCompositeOperation = 'source-atop';
    dg.fillStyle = 'rgba(34,50,62,0.4)';
    dg.fillRect(0, 0, d.width, d.height);

    return { c: c, d: d, ts: ts, uw: uw, uh: uh };
  }

  function buildTreeSprites() {
    treeSprites = [];
    for (var i = 0; i < TREES.length; i++) {
      try { treeSprites.push(makeTreeSprite(TREES[i])); } catch (e) { treeSprites.push(null); }
    }
  }

  function drawTrees() {
    var wind = currentWind();
    for (var i = 0; i < TREES.length; i++) {
      var t = TREES[i];
      var sp = treeSprites[i];
      if (!sp) { continue; }
      var x = t.x * W;
      var y = hillY(HILLS[t.h], x) + 3;
      var sway = reduce ? 0 : Math.sin(clock * 0.8 + t.x * 10) * 0.012 * (1 + wind);
      var dw = sp.uw * sp.ts;
      var dh = sp.uh * sp.ts;
      var oy = -(sp.uh - 6) * sp.ts;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(sway);
      ctx.drawImage(sp.c, -dw / 2, oy, dw, dh);
      if (amt.dark > 0.02) {
        ctx.globalAlpha = amt.dark;
        ctx.drawImage(sp.d, -dw / 2, oy, dw, dh);
      }
      ctx.restore();
    }
  }

  function drawBolts() {
    for (var i = 0; i < bolts.length; i++) {
      var b = bolts[i];
      var k = boltIntensity(b.t);
      if (k <= 0.01) { continue; }
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,' + k + ')';
      ctx.shadowColor = 'rgba(190,215,255,' + k + ')';
      ctx.shadowBlur = 24;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (var j = 1; j < b.pts.length; j++) { ctx.lineTo(b.pts[j][0], b.pts[j][1]); }
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.branch[0][0], b.branch[0][1]);
      for (var m = 1; m < b.branch.length; m++) { ctx.lineTo(b.branch[m][0], b.branch[m][1]); }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFlash() {
    var level = 0;
    for (var i = 0; i < bolts.length; i++) {
      level = Math.max(level, boltIntensity(bolts[i].t));
    }
    if (level > 0.01) {
      ctx.fillStyle = 'rgba(225,235,255,' + (0.38 * level) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawLeaves() {
    for (var i = 0; i < leaves.length; i++) {
      var l = leaves[i];
      var x = l.x + Math.sin(clock * l.fr + l.ph) * l.amp;
      ctx.save();
      ctx.translate(x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = l.col;
      ctx.beginPath();
      ctx.moveTo(-l.s, 0);
      ctx.quadraticCurveTo(0, -l.s * 0.8, l.s, 0);
      ctx.quadraticCurveTo(0, l.s * 0.8, -l.s, 0);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawRain() {
    if (amt.rain <= 0.02) { return; }
    var n = Math.floor(drops.length * amt.rain);
    ctx.strokeStyle = 'rgba(235,245,255,' + (0.1 + 0.55 * amt.rain) + ')';
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var d = drops[i];
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.len * 0.18, d.y + d.len);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(110,128,142,' + (0.12 * amt.rain) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    drawSky();
    drawSun();
    drawRainbow();
    drawClouds();
    drawBolts();
    drawBirds();
    drawLeaves();
    drawRain();
    drawFlash();
  }

  /* ---------- setup ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (reduce) { draw(); }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });
  window.addEventListener('pagehide', saveState);

  loadState();
  resize();
  makeClouds();
  makeLeaves();
  makeDrops();

  window.Weather = {
    onThunder: function (cb) { thunderCbs.push(cb); },
    getState: function () { return state; },
    getAmounts: function () {
      return { dark: amt.dark, rain: amt.rain, sun: amt.sun, rainbow: amt.rainbow, wind: currentWind() };
    }
  };

  if (reduce) {
    draw();
    return;
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  <script>
/* ==========================================================
   Nature sound, generated live in the browser (no audio files).
   - wind: always soft, a little stronger in rain
   - rain: follows the rain in the sky
   - birds: chirp only when the sky is clear
   Browsers block sound until the visitor interacts with the page,
   so there is a Sound on/off button. The choice is remembered.
   ========================================================== */
(function () {
  'use strict';

  var KEY = 'portfolio-sound';
  var AC = window.AudioContext || window.webkitAudioContext;

  var enabled = false;
  var ctx = null;
  var master = null;
  var windGain = null;
  var rainGain = null;
  var birdGain = null;
  var noiseBuf = null;
  var birdTimer = null;
  var btn = null;

  var ICON_ON =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_OFF =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l5 6"/><path d="M21 9l-5 6"/></svg>';

  function readPref() {
    try { return localStorage.getItem(KEY) === 'on'; } catch (e) { return false; }
  }
  function writePref(on) {
    try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  }

  function amounts() {
    if (window.Weather && window.Weather.getAmounts) { return window.Weather.getAmounts(); }
    return { rain: 0, sun: 1, wind: 0.3 };
  }

  /* ---------- button ---------- */
  function setUi() {
    if (!btn) { return; }
    btn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
    btn.setAttribute('aria-label', enabled ? 'Turn nature sound off' : 'Turn nature sound on');
    btn.innerHTML = (enabled ? ICON_ON : ICON_OFF) + '<span>Sound ' + (enabled ? 'on' : 'off') + '</span>';
  }

  function createButton() {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sound-btn glass';
    btn.addEventListener('click', function () {
      if (enabled) { disable(); } else { enable(true); }
    });
    var slot = document.getElementById('sound-slot');
    (slot || document.body).appendChild(btn);
    setUi();
  }

  /* ---------- audio graph ---------- */
  function makeNoise() {
    var len = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { data[i] = Math.random() * 2 - 1; }
    return buf;
  }

  function buildAudio() {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    var noise = makeNoise();
    noiseBuf = noise;

    /* wind */
    var wsrc = ctx.createBufferSource();
    wsrc.buffer = noise;
    wsrc.loop = true;
    var wlp = ctx.createBiquadFilter();
    wlp.type = 'lowpass';
    wlp.frequency.value = 420;
    wlp.Q.value = 0.8;
    windGain = ctx.createGain();
    windGain.gain.value = 0.05;
    wsrc.connect(wlp);
    wlp.connect(windGain);
    windGain.connect(master);

    var lfo1 = ctx.createOscillator();
    lfo1.frequency.value = 0.11;
    var lfo1Depth = ctx.createGain();
    lfo1Depth.gain.value = 180;
    lfo1.connect(lfo1Depth);
    lfo1Depth.connect(wlp.frequency);

    var lfo2 = ctx.createOscillator();
    lfo2.frequency.value = 0.07;
    var lfo2Depth = ctx.createGain();
    lfo2Depth.gain.value = 0.025;
    lfo2.connect(lfo2Depth);
    lfo2Depth.connect(windGain.gain);

    /* rain */
    var rsrc = ctx.createBufferSource();
    rsrc.buffer = noise;
    rsrc.loop = true;
    var rhp = ctx.createBiquadFilter();
    rhp.type = 'highpass';
    rhp.frequency.value = 800;
    var rlp = ctx.createBiquadFilter();
    rlp.type = 'lowpass';
    rlp.frequency.value = 8000;
    rainGain = ctx.createGain();
    rainGain.gain.value = 0;
    rsrc.connect(rhp);
    rhp.connect(rlp);
    rlp.connect(rainGain);
    rainGain.connect(master);

    /* birds bus */
    birdGain = ctx.createGain();
    birdGain.gain.value = 0.6;
    birdGain.connect(master);

    wsrc.start();
    rsrc.start();
    lfo1.start();
    lfo2.start();

    setInterval(updateMix, 250);
  }

  function updateMix() {
    if (!ctx || !enabled) { return; }
    var a = amounts();
    var now = ctx.currentTime;
    windGain.gain.setTargetAtTime(0.04 + 0.09 * a.wind, now, 0.6);
    rainGain.gain.setTargetAtTime(0.22 * a.rain, now, 0.6);
  }

  /* ---------- birds ---------- */
  function chirpPhrase(t) {
    var base = 2300 + Math.random() * 1700;
    var notes = 2 + Math.floor(Math.random() * 4);
    for (var k = 0; k < notes; k++) {
      var t0 = t + k * 0.12;
      var osc = ctx.createOscillator();
      var env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * (0.92 + Math.random() * 0.2), t0);
      osc.frequency.exponentialRampToValueAtTime(base * (1.15 + Math.random() * 0.4), t0 + 0.07);
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.linearRampToValueAtTime(0.16, t0 + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
      osc.connect(env);
      env.connect(birdGain);
      osc.start(t0);
      osc.stop(t0 + 0.11);
    }
  }

  function scheduleBird() {
    clearTimeout(birdTimer);
    if (!enabled || !ctx) { return; }
    var a = amounts();
    if (a.rain < 0.15 && a.sun > 0.2 && ctx.state === 'running') {
      var phrases = 1 + Math.floor(Math.random() * 3);
      for (var i = 0; i < phrases; i++) {
        chirpPhrase(ctx.currentTime + 0.05 + i * 0.55);
      }
    }
    birdTimer = setTimeout(scheduleBird, 2200 + Math.random() * 5000);
  }

  /* ---------- thunder (after each lightning flash) ---------- */
  function thunder() {
    if (!enabled || !ctx || ctx.state !== 'running' || !noiseBuf) { return; }
    var t0 = ctx.currentTime + 0.4 + Math.random() * 1.0;
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.9;
    lp.frequency.setValueAtTime(420, t0);
    lp.frequency.exponentialRampToValueAtTime(70, t0 + 2.8);
    var env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.linearRampToValueAtTime(1.1, t0 + 0.08);
    env.gain.exponentialRampToValueAtTime(0.35, t0 + 0.6);
    env.gain.linearRampToValueAtTime(0.5, t0 + 0.9);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);
    src.connect(lp);
    lp.connect(env);
    env.connect(master);
    src.start(t0);
    src.stop(t0 + 3.3);
  }

  /* ---------- on / off ---------- */
  function enable(persist) {
    if (!AC) { return; }
    if (!ctx) { buildAudio(); }
    enabled = true;
    if (persist) { writePref(true); }
    if (ctx.resume) { ctx.resume(); }
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.4);
    setUi();
    scheduleBird();
  }

  function disable() {
    enabled = false;
    writePref(false);
    clearTimeout(birdTimer);
    if (ctx) {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
      setTimeout(function () {
        if (!enabled && ctx && ctx.state === 'running') { ctx.suspend(); }
      }, 800);
    }
    setUi();
  }

  /* If sound was on during the last page, start again after the first touch/click/key */
  function armResume() {
    var events = ['pointerdown', 'keydown', 'touchstart'];
    function handler(e) {
      if (btn && e.target && btn.contains(e.target)) { return; }
      if (enabled && ctx && ctx.state !== 'running') { ctx.resume(); }
      for (var i = 0; i < events.length; i++) { document.removeEventListener(events[i], handler, true); }
    }
    for (var i = 0; i < events.length; i++) { document.addEventListener(events[i], handler, true); }
  }

  function init() {
    createButton();
    if (window.Weather && window.Weather.onThunder) { window.Weather.onThunder(thunder); }
    if (!AC) {
      btn.disabled = true;
      btn.innerHTML = '<span>Sound not supported</span>';
      return;
    }
    if (readPref()) {
      enable(false);
      armResume();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  }

    var brand = h('a', 'brand', SITE.name || 'Portfolio');

    var toggle = h('button', 'nav-toggle', 'Menu');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');

    var list = h('ul', 'nav-links');
    list.id = 'nav-links';
    PAGES.forEach(function (p) {
      var li = h('li');
      var a = h('a', 'nav-link', p[1]);
      a.href = p[0];
      if (p[2] === current) { a.setAttribute('aria-current', 'page'); }
      li.appendChild(a);
      list.appendChild(li);
    });

    toggle.addEventListener('click', function () {
      var open = list.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.textContent = open ? 'Close' : 'Menu';
    });

    var group = h('div', 'brand-group');
    group.appendChild(brand);
    var slot = h('span', 'sound-slot');
    slot.id = 'sound-slot';
    group.appendChild(slot);

    nav.appendChild(toggle);
    nav.appendChild(list);
    host.appendChild(nav);

    var soundBtn = document.querySelector('.sound-btn');

      if (list.classList.contains('is-open')) {
        lastY = y;
        return;

      if (y > lastY && y > 90) {
        host.classList.add('nav-hidden');
      } else if (y < lastY) {
        host.classList.remove('nav-hidden');
      }
      lastY = y;
    }, { passive: true });

  /* ---------- social links ---------- */
  function renderSocial() {
    var boxes = document.querySelectorAll('[data-social]');
    Array.prototype.forEach.call(boxes, function (box) {
      var data = SITE.social || {};
      Object.keys(SOCIAL_LABELS).forEach(function (key) {
        var url = data[key];
        var node;
        if (url) {
          node = h('a', 'social-link', SOCIAL_LABELS[key]);
          node.href = url;
          node.target = '_blank';
          node.rel = 'noopener';
        } else {
          node = h('span', 'social-link is-empty', SOCIAL_LABELS[key]);
          node.title = 'Link coming soon';
        }
        box.appendChild(node);
      });
    });
  }

  /* ---------- photo ---------- */
  function setupPhoto() {
    var img = document.getElementById('photo');
    var initial = document.getElementById('photo-initial');
    if (!img) { return; }
    if (initial && SITE.name) { initial.textContent = SITE.name.charAt(0).toUpperCase(); }
    img.hidden = true;
    img.addEventListener('load', function () {
      img.hidden = false;
      if (initial) { initial.hidden = true; }
    });
    img.addEventListener('error', function () {
      img.hidden = true;
      if (initial) { initial.hidden = false; }
    });
    if (SITE.photo) { img.src = SITE.photo; }
  }

  /* ---------- resume (optional) ---------- */
  function setupResume() {
    var block = document.getElementById('resume-block');
    if (!block) { return; }
    if (!SITE.resume) { block.hidden = true; return; }
    var link = document.getElementById('resume-link');
    if (link) { link.href = SITE.resume; }
    block.hidden = false;
  }

  /* ---------- services ---------- */
  function renderServices() {
    var grid = document.getElementById('services-grid');
    if (!grid) { return; }
    (SITE.services || []).forEach(function (s) {
      var card = h('article', 'card glass');
      var top = h('div', 'card-top');
      top.appendChild(h('h3', 'card-title', s.name));
      if (s.free) { top.appendChild(h('span', 'badge-free', 'Free')); }
      card.appendChild(top);
      card.appendChild(h('p', 'card-text', s.description));
      grid.appendChild(card);
    });
  }

  /* ---------- projects ---------- */
  function renderProjects() {
    var grid = document.getElementById('projects-grid');
    if (!grid) { return; }
    (SITE.projects || []).forEach(function (p) {
      var card = h('article', 'card glass project-card');

      var media = h('div', 'project-media');
      if (p.image) {
        var img = document.createElement('img');
        img.src = p.image;
        img.alt = p.title + ' screenshot';
        img.loading = 'lazy';
        media.appendChild(img);
      } else {
        media.appendChild(h('span', 'project-media-text', 'Screenshot goes here'));
      }
      card.appendChild(media);

      card.appendChild(h('h3', 'card-title', p.title));
      card.appendChild(h('p', 'card-text', p.description));

      var review = h('blockquote', 'review');
      if (p.review) {
        review.appendChild(h('p', 'review-text', '\u201C' + p.review + '\u201D'));
        if (p.reviewer) { review.appendChild(h('footer', 'review-by', '\u2014 ' + p.reviewer)); }
      } else {
        review.className = 'review is-empty';
        review.appendChild(h('p', 'review-text', 'Client review will appear here.'));
      }
      card.appendChild(review);

      var actions = h('div', 'card-actions');
      if (p.link) {
        var a = h('a', 'btn btn-small', 'View project');
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener';
        actions.appendChild(a);
      } else {
        actions.appendChild(h('span', 'muted', 'Link coming soon'));
      }
      card.appendChild(actions);

      grid.appendChild(card);
    });
  }

  /* ---------- skills tree ---------- */
  var SVGNS = 'http://www.w3.org/2000/svg';
  var selectedSkill = -1;
  var lastMobile = null;

  function s(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  function seeded(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function leafPath(w, hgt) {
    var hw = w / 2;
    return 'M ' + (-hw) + ' 0 C ' + (-w / 4) + ' ' + (-hgt * 0.75) + ' ' + (w / 4) + ' ' + (-hgt * 0.75) + ' ' + hw + ' 0 ' +
      'C ' + (w / 4) + ' ' + (hgt * 0.75) + ' ' + (-w / 4) + ' ' + (hgt * 0.75) + ' ' + (-hw) + ' 0 Z';
  }

  function layoutTree(n, mobile) {
    var rows = Math.ceil(n / 2);
    var o = mobile ? {
      w: 420, cx: 210, trunkTop: 270, firstY: 345, gap: 98,
      leafW: 156, leafH: 68, font: 15, stem: 14, topW: 24, baseW: 52,
      crown: { cx: 210, cy: 150, rx: 205, ry: 135 }, k: 0.47, lk: 0.66, tail: 100, bottom: 90
    } : {
      w: 900, cx: 450, trunkTop: 300, firstY: 380, gap: 100,
      leafW: 190, leafH: 84, font: 18, stem: 36, topW: 40, baseW: 84,
      crown: { cx: 450, cy: 170, rx: 370, ry: 160 }, k: 1, lk: 0.9, tail: 80, bottom: 80
    };
    var y0 = o.firstY + (rows - 1) * o.gap + o.tail;
    var h = y0 + o.bottom;

    function tw(y) {
      var t = Math.max(0, Math.min(1, (y - o.trunkTop) / (y0 - o.trunkTop)));
      return o.topW + (o.baseW - o.topW) * Math.pow(t, 1.8);
    }

    var pts = [];
    for (var i = 0; i < n; i++) {
      var side = i % 2 === 0 ? -1 : 1;
      var r = Math.floor(i / 2);
      var y = o.firstY + r * o.gap;
      var ax = o.cx + side * (tw(y) - 4);
      var x = ax + side * (o.stem + o.leafW / 2);
      var rot = Math.max(0, 9 - r * 4) * (side < 0 ? 1 : -1);
      pts.push({ x: x, y: y, rot: rot, side: side, ax: ax });
    }
    return {
      w: o.w, h: h, cx: o.cx, y0: y0, trunkTop: o.trunkTop, pts: pts, tw: tw,
      crown: o.crown, leafW: o.leafW, leafH: o.leafH, font: o.font,
      topW: o.topW, baseW: o.baseW, k: o.k, lk: o.lk
    };
  }

  var treeLayout = null;
  var modalRef = null;

  function srUpdate(text) {
    var d = document.getElementById('skill-detail');
    if (d) { d.textContent = text; }
  }

  function ensureModal() {
    if (modalRef) { return modalRef; }
    var backdrop = h('div', 'skill-backdrop');
    var modal = h('div', 'skill-modal');
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'skill-modal-title');
    backdrop.addEventListener('click', function () { closeSkill(); });
    document.body.appendChild(backdrop);
    document.body.appendChild(modal);
    modalRef = { backdrop: backdrop, modal: modal };
    return modalRef;
  }

  function closeSkill() {
    selectedSkill = -1;
    var leafEls = document.querySelectorAll('#tree .leaf');
    Array.prototype.forEach.call(leafEls, function (g) { g.classList.remove('is-open'); });
    if (modalRef) {
      modalRef.modal.classList.remove('show');
      modalRef.backdrop.classList.remove('show');
    }
  }

  function openSkill(i) {
    var skill = (SITE.skills || [])[i];
    if (!skill || !treeLayout) { return; }
    var m = ensureModal();
    selectedSkill = i;

    var gap = treeLayout.leafH * 0.5;
    var leafEls = document.querySelectorAll('#tree .leaf');
    Array.prototype.forEach.call(leafEls, function (g, k) {
      var open = k === i;
      g.classList.toggle('is-open', open);
      if (open) { g.style.setProperty('--d', gap + 'px'); }
    });

    m.modal.innerHTML = '';
    var title = h('h3', 'skill-modal-title', skill.name);
    title.id = 'skill-modal-title';
    m.modal.appendChild(title);
    m.modal.appendChild(h('p', 'skill-modal-text', skill.description));
    if (typeof skill.level === 'number') {
      var wrap = h('div', 'level');
      var fill = h('div', 'level-fill');
      fill.style.width = Math.max(0, Math.min(100, skill.level)) + '%';
      wrap.appendChild(fill);
      m.modal.appendChild(wrap);
      m.modal.appendChild(h('p', 'level-text', 'Level: ' + Math.round(skill.level) + '%'));
    }
    var close = h('button', 'skill-close', '\u00D7');
    close.type = 'button';
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', function (e) {
      e.stopPropagation();
      closeSkill();
    });
    m.modal.appendChild(close);

    m.backdrop.classList.add('show');
    m.modal.classList.add('show');
    srUpdate(skill.name + '. ' + skill.description);
    close.focus();
  }

  function showSkill(i) {
    if (i < 0 || i === selectedSkill) {
      closeSkill();
      return;
    }
    openSkill(i);
  }

  function addStops(grad, stops) {
    stops.forEach(function (st) {
      grad.appendChild(s('stop', { offset: st[0], 'stop-color': st[1] }));
    });
  }

  function bezPoint(p0, p1, p2, p3, t) {
    var u = 1 - t;
    var x = u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0];
    var y = u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1];
    var dx = 3 * u * u * (p1[0] - p0[0]) + 6 * u * t * (p2[0] - p1[0]) + 3 * t * t * (p3[0] - p2[0]);
    var dy = 3 * u * u * (p1[1] - p0[1]) + 6 * u * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1]);
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: x, y: y, dx: dx / len, dy: dy / len };
  }

  /* a branch that gets thinner towards its tip */
  function taperedBranch(p0, p1, p2, p3, w0, w1) {
    var left = [];
    var right = [];
    var steps = 14;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var pt = bezPoint(p0, p1, p2, p3, t);
      var w = (w0 + (w1 - w0) * t) / 2;
      left.push((pt.x - pt.dy * w).toFixed(1) + ' ' + (pt.y + pt.dx * w).toFixed(1));
      right.push((pt.x + pt.dy * w).toFixed(1) + ' ' + (pt.y - pt.dx * w).toFixed(1));
    }
    return 'M ' + left.join(' L ') + ' L ' + right.reverse().join(' L ') + ' Z';
  }

  function buildTree() {
    var host = document.getElementById('tree');
    var skills = SITE.skills || [];
    if (!host || !skills.length) { return; }

    var mobile = window.innerWidth < 640;
    lastMobile = mobile;
    var L = layoutTree(skills.length, mobile);
    var rnd = seeded(11);
    var k = L.k;
    var cx = L.cx;
    var y0 = L.y0;
    var i;

    host.innerHTML = '';
    var topPad = mobile ? 0 : 40;
    var svg = s('svg', { viewBox: '0 ' + (-topPad) + ' ' + L.w + ' ' + (L.h + topPad), role: 'group', preserveAspectRatio: 'xMidYMax meet', 'aria-label': 'A big tree with my skills written on its leaves' });

    /* gradients and one small leaf shape that is reused hundreds of times */
    var defs = s('defs');
    var gy = L.leafH * 0.45;
    var bark = s('linearGradient', { id: 'bark-grad', x1: '0', y1: '0', x2: '1', y2: '0' });
    addStops(bark, [['0', '#3d2815'], ['0.3', '#7a5533'], ['0.6', '#6b4a2f'], ['1', '#33200f']]);
    var soilG = s('linearGradient', { id: 'soil-grad', x1: '0', y1: '0', x2: '0', y2: '1' });
    addStops(soilG, [['0', '#6b4a2f'], ['1', '#33200f']]);
    var grassG = s('linearGradient', { id: 'grass-grad', x1: '0', y1: '0', x2: '0', y2: '1' });
    addStops(grassG, [['0', '#86c050'], ['1', '#4a8338']]);
    var mossG = s('linearGradient', { id: 'moss-grad', x1: '0', y1: '0', x2: '0', y2: '1' });
    addStops(mossG, [['0', 'rgba(63,125,58,0)'], ['0.75', 'rgba(63,125,58,0)'], ['1', 'rgba(63,125,58,0.55)']]);
    var leafG = s('linearGradient', { id: 'leaf-grad', gradientUnits: 'userSpaceOnUse', x1: '0', y1: -gy, x2: '0', y2: gy });
    addStops(leafG, [['0', '#6fb24a'], ['1', '#2f6b2f']]);
    var leafH = s('linearGradient', { id: 'leaf-grad-hover', gradientUnits: 'userSpaceOnUse', x1: '0', y1: -gy, x2: '0', y2: gy });
    addStops(leafH, [['0', '#86c85c'], ['1', '#3a7f36']]);
    var leafS = s('linearGradient', { id: 'leaf-grad-sel', gradientUnits: 'userSpaceOnUse', x1: '0', y1: -gy, x2: '0', y2: gy });
    addStops(leafS, [['0', '#b4dc6a'], ['1', '#5a9a3a']]);
    [bark, soilG, grassG, mossG, leafG, leafH, leafS].forEach(function (gr) { defs.appendChild(gr); });
    defs.appendChild(s('path', {
      id: 'lf', d: 'M -0.5 0 C -0.25 -0.32 0.25 -0.32 0.5 0 C 0.25 0.32 -0.25 0.32 -0.5 0 Z',
      stroke: 'rgba(20,50,20,0.3)', 'stroke-width': '0.04'
    }));
    svg.appendChild(defs);

    /* ---------- the land: flat soil with a grass top, edge to edge ---------- */
    var Wm = L.w / 2 - 6;
    var Wf = 1800;
    function topY(x) { return y0 + Math.sin(x * 0.012) * 3 + Math.sin(x * 0.004 + 1) * 4; }

    var ground = s('g', { 'aria-hidden': 'true' });
    var tp = [];
    var gb = [];
    var gx;
    for (gx = cx - Wf; gx <= cx + Wf + 0.1; gx += 20) {
      tp.push(gx.toFixed(1) + ' ' + topY(gx).toFixed(1));
      gb.push(gx.toFixed(1) + ' ' + (topY(gx) + 16 + Math.sin(gx * 0.05 + 2) * 3).toFixed(1));
    }
    ground.appendChild(s('path', {
      d: 'M ' + tp.join(' L ') + ' L ' + (cx + Wf) + ' ' + L.h + ' L ' + (cx - Wf) + ' ' + L.h + ' Z',
      fill: 'url(#soil-grad)'
    }));
    for (i = 0; i < 320; i++) {
      var sx = cx - Wf + rnd() * Wf * 2;
      var sy = topY(sx) + 22 + rnd() * (L.h - y0 - 26);
      ground.appendChild(s('circle', {
        cx: sx.toFixed(1), cy: sy.toFixed(1), r: (0.8 + rnd() * 2.2).toFixed(1),
        fill: rnd() < 0.5 ? '#2e1c0d' : '#8a6340', opacity: '0.6'
      }));
    }
    for (i = 0; i < 22; i++) {
      var stx = cx - Wf * 0.9 + rnd() * Wf * 1.8;
      var sty = topY(stx) + 28 + rnd() * (L.h - y0 - 44);
      ground.appendChild(s('ellipse', { cx: stx.toFixed(1), cy: sty.toFixed(1), rx: (6 + rnd() * 9).toFixed(1), ry: (3 + rnd() * 3).toFixed(1), fill: '#8d8a80', opacity: '0.8' }));
    }
    ground.appendChild(s('path', {
      d: 'M ' + tp.join(' L ') + ' L ' + gb.slice().reverse().join(' L ') + ' Z',
      fill: 'url(#grass-grad)'
    }));
    ground.appendChild(s('path', { d: 'M ' + tp.join(' L '), fill: 'none', stroke: '#a5d86a', 'stroke-width': '2' }));
    var farBlades = s('g', { fill: 'none', 'stroke-linecap': 'round' });
    for (gx = cx - Wf; gx <= cx + Wf; gx += 11) {
      var bh = 7 + rnd() * 13;
      farBlades.appendChild(s('path', {
        d: 'M ' + gx.toFixed(1) + ' ' + (topY(gx) + 3).toFixed(1) + ' q ' + ((rnd() - 0.5) * 6).toFixed(1) + ' ' + (-bh / 2).toFixed(1) + ' ' + ((rnd() - 0.5) * 8).toFixed(1) + ' ' + (-bh).toFixed(1),
        stroke: rnd() < 0.5 ? '#4f8a3c' : '#79b648', 'stroke-width': '2'
      }));
    }
    ground.appendChild(farBlades);
    ground.appendChild(s('ellipse', { cx: cx, cy: y0 + 8, rx: L.baseW * 2, ry: 12 * Math.max(0.7, k), fill: 'rgba(15,45,20,0.3)' }));
    svg.appendChild(ground);

    /* ---------- roots that spread into the soil ---------- */
    var rootsG = s('g', { fill: '#4a301b', stroke: '#2e1c0d', 'stroke-width': '0.8', 'aria-hidden': 'true' });
    [-1, -0.72, -0.42, 0.42, 0.72, 1].forEach(function (a) {
      var reach = L.baseW + (110 + rnd() * 90) * k;
      var P0 = [cx + a * L.baseW * 0.35, y0 - 50 * k];
      var P1 = [cx + a * (L.baseW + 20 * k), y0 - 14 * k];
      var P2 = [cx + a * (L.baseW + reach * 0.5), y0 + 6 * k];
      var P3 = [cx + a * reach, y0 + (16 + rnd() * 16) * k];
      rootsG.appendChild(s('path', { d: taperedBranch(P0, P1, P2, P3, 26 * k + 4, 3) }));
    });
    svg.appendChild(rootsG);

    /* ---------- thick trunk with bark ---------- */
    var left = [];
    var right = [];
    for (var ty = L.trunkTop; ty <= y0 + 14; ty += 14) {
      var wob = Math.sin(ty * 0.05) * 3 * k + Math.sin(ty * 0.13 + 1) * 1.6 * k;
      var half = L.tw(Math.min(ty, y0)) + wob;
      left.push((cx - half).toFixed(1) + ' ' + ty);
      right.push((cx + half).toFixed(1) + ' ' + ty);
    }
    var trunk = s('path', {
      d: 'M ' + left.join(' L ') + ' L ' + right.slice().reverse().join(' L ') + ' Z',
      fill: 'url(#bark-grad)', stroke: '#2e1c0d', 'stroke-width': '1', 'aria-hidden': 'true'
    });
    svg.appendChild(trunk);

    var texture = s('g', { fill: 'none', 'stroke-linecap': 'round', 'aria-hidden': 'true' });
    for (i = 0; i < 52; i++) {
      var by = L.trunkTop + 10 + rnd() * (y0 - L.trunkTop - 20);
      var bx = cx + (rnd() * 2 - 1) * L.tw(by) * 0.85;
      var bl = (24 + rnd() * 54) * Math.max(0.6, k);
      texture.appendChild(s('path', {
        d: 'M ' + bx.toFixed(1) + ' ' + by.toFixed(1) + ' q ' + ((rnd() - 0.5) * 10).toFixed(1) + ' ' + (-bl / 2).toFixed(1) + ' ' + ((rnd() - 0.5) * 8).toFixed(1) + ' ' + (-bl).toFixed(1),
        stroke: i % 4 === 0 ? 'rgba(205,165,115,0.28)' : 'rgba(25,14,6,0.45)',
        'stroke-width': i % 4 === 0 ? '1.4' : '1.8'
      }));
    }
    [0.25, 0.5, 0.72].forEach(function (f, idx) {
      var ky = L.trunkTop + (y0 - L.trunkTop) * f;
      var kx = cx + (idx % 2 === 0 ? -1 : 1) * L.tw(ky) * 0.35;
      texture.appendChild(s('ellipse', { cx: kx.toFixed(1), cy: ky.toFixed(1), rx: (7 * k + 2).toFixed(1), ry: (12 * k + 3).toFixed(1), fill: '#3a2412', stroke: '#24150a', 'stroke-width': '1.2' }));
    });
    svg.appendChild(texture);

    var moss = trunk.cloneNode(false);
    moss.setAttribute('fill', 'url(#moss-grad)');
    moss.setAttribute('stroke', 'none');
    svg.appendChild(moss);

    /* ---------- crown: dark mass, then limbs, then leaves ---------- */
    var C = L.crown;
    var darkPal = ['#1f4d26', '#2a5e2e', '#2f6b2f'];
    var mass = s('g', { 'aria-hidden': 'true' });
    var blobCount = mobile ? 42 : 72;
    for (i = 0; i < blobCount; i++) {
      var ba = rnd() * Math.PI * 2;
      var br = Math.sqrt(rnd()) * 0.92;
      mass.appendChild(s('circle', {
        cx: (C.cx + Math.cos(ba) * br * C.rx).toFixed(1),
        cy: (C.cy + Math.sin(ba) * br * C.ry).toFixed(1),
        r: ((34 + rnd() * 26) * (mobile ? 0.62 : 1)).toFixed(1),
        fill: darkPal[Math.floor(rnd() * darkPal.length)], opacity: '0.92'
      }));
    }
    svg.appendChild(mass);

    var wood = s('g', { fill: '#5a3d26', stroke: '#3d2815', 'stroke-width': '0.6', 'aria-hidden': 'true' });
    var tips = [];
    function limb(x, y, ang, len, wid, depth) {
      var a = ang;
      if (Math.sin(a) > -0.2) { a = Math.cos(a) > 0 ? -0.3 : -Math.PI + 0.3; }
      var x2 = x + Math.cos(a) * len;
      var y2 = y + Math.sin(a) * len;
      var mx = x + Math.cos(a) * len * 0.5 + (rnd() - 0.5) * len * 0.18;
      var my = y + Math.sin(a) * len * 0.5 + (rnd() - 0.5) * len * 0.18;
      wood.appendChild(s('path', { d: taperedBranch([x, y], [mx, my], [mx, my], [x2, y2], wid, wid * 0.68) }));
      if (depth <= 2) { tips.push([x2, y2]); }
      if (depth <= 0 || len < 14 * k) { return; }
      var n = depth > 2 ? 2 : (rnd() < 0.5 ? 2 : 3);
      for (var j = 0; j < n; j++) {
        var sd = n === 2 ? (j === 0 ? -1 : 1) : (j - 1);
        limb(x2, y2, a + sd * (0.4 + rnd() * 0.35), len * (0.72 + rnd() * 0.1), wid * 0.68, depth - 1);
      }
    }
    [-2.5, -2.05, -1.7, -1.4, -1.1, -0.65].forEach(function (a0, idx) {
      limb(cx + (idx - 2.5) * 6 * k, L.trunkTop + 14 * k, a0 + (rnd() - 0.5) * 0.1,
        (112 - Math.abs(idx - 2.5) * 6) * L.lk, 26 * k + 4, 4);
    });
    svg.appendChild(wood);

    var lights = ['#a5d86a', '#8cc152'];
    var mids = ['#5f9e3f', '#7bb662'];
    var darks = ['#2f6b2f', '#3f7d3a'];
    var leafLayer = s('g', { 'aria-hidden': 'true' });
    var sizeMin = mobile ? 16 : 24;
    var sizeVar = mobile ? 10 : 14;
    function crownLeaf(x, y) {
      var u = (x - C.cx) / C.rx;
      var v = (y - C.cy) / C.ry;
      var shade = -u * 0.45 - v * 0.55 + (rnd() - 0.5) * 0.5;
      var pal = shade > 0.35 ? lights : (shade > -0.1 ? mids : darks);
      var size = sizeMin + rnd() * sizeVar;
      leafLayer.appendChild(s('use', {
        href: '#lf',
        transform: 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + Math.round(rnd() * 360) + ') scale(' + size.toFixed(1) + ')',
        fill: pal[Math.floor(rnd() * pal.length)]
      }));
    }
    var spread = mobile ? 18 : 30;
    tips.forEach(function (tp2) {
      for (var n = 0; n < 5; n++) {
        crownLeaf(tp2[0] + (rnd() - 0.5) * spread * 2, tp2[1] + (rnd() - 0.5) * spread * 1.6);
      }
    });
    var fillCount = mobile ? 230 : 400;
    for (i = 0; i < fillCount; i++) {
      var la = rnd() * Math.PI * 2;
      var lr = Math.sqrt(rnd());
      crownLeaf(C.cx + Math.cos(la) * lr * C.rx, C.cy + Math.sin(la) * lr * C.ry);
    }
    svg.appendChild(leafLayer);

    /* ---------- grass, flowers in front of the trunk base ---------- */
    var front = s('g', { 'aria-hidden': 'true', fill: 'none', 'stroke-linecap': 'round' });
    for (i = 0; i < 90; i++) {
      var fx0 = cx + (rnd() * 2 - 1) * Wm * 0.95;
      var fh = (9 + rnd() * 20) * Math.max(0.7, k);
      front.appendChild(s('path', {
        d: 'M ' + fx0.toFixed(1) + ' ' + (topY(fx0) + 5 + rnd() * 8).toFixed(1) + ' q ' + ((rnd() - 0.5) * 10).toFixed(1) + ' ' + (-fh / 2).toFixed(1) + ' ' + ((rnd() - 0.5) * 14).toFixed(1) + ' ' + (-fh).toFixed(1),
        stroke: rnd() < 0.5 ? '#3f7d3a' : '#5f9e3f', 'stroke-width': '2.2'
      }));
    }
    var flowerColors = ['#ffe45c', '#ffffff', '#ff9ec4', '#ffb347'];
    for (i = 0; i < 16; i++) {
      var flx = cx + (rnd() * 2 - 1) * Wm * 0.9;
      var fly = topY(flx) - 2 - rnd() * 8;
      front.appendChild(s('line', { x1: flx.toFixed(1), y1: (fly + 10).toFixed(1), x2: flx.toFixed(1), y2: fly.toFixed(1), stroke: '#3f7d3a', 'stroke-width': '1.6' }));
      front.appendChild(s('circle', { cx: flx.toFixed(1), cy: fly.toFixed(1), r: (2.6 + rnd() * 1.4).toFixed(1), fill: flowerColors[Math.floor(rnd() * flowerColors.length)], stroke: 'none' }));
    }
    svg.appendChild(front);

    /* ---------- skill leaves hang on short stems from the trunk ---------- */
    var stems = s('g', { fill: '#5a3d26', stroke: '#3d2815', 'stroke-width': '0.6', 'aria-hidden': 'true' });
    L.pts.forEach(function (p) {
      var rad = p.rot * Math.PI / 180;
      var lx = -p.side * L.leafW / 2;
      var tipX = p.x + lx * Math.cos(rad);
      var tipY = p.y + lx * Math.sin(rad);
      stems.appendChild(s('path', {
        d: taperedBranch([p.ax, p.y - 8], [p.ax + p.side * 10, p.y - 18], [tipX - p.side * 8, tipY - 8], [tipX, tipY], 9, 3.5)
      }));
    });
    svg.appendChild(stems);

    function halfPath(w, hgt, dir) {
      var hw = w / 2;
      return 'M ' + (-hw) + ' 0 C ' + (-w / 4) + ' ' + (dir * hgt * 0.75) + ' ' + (w / 4) + ' ' + (dir * hgt * 0.75) + ' ' + hw + ' 0 Z';
    }
    skills.forEach(function (skill, idx) {
      var p = L.pts[idx];
      var g = s('g', {
        'class': 'leaf' + (p.side < 0 ? ' from-right' : ''),
        transform: 'translate(' + p.x.toFixed(1) + ' ' + p.y + ') rotate(' + p.rot + ')',
        tabindex: '0',
        role: 'button',
        'aria-label': skill.name + '. Press to open.'
      });
      var inner = s('g', { 'class': 'leaf-inner' });
      [[-1, 'half half-top'], [1, 'half half-bottom']].forEach(function (cfg) {
        var dir = cfg[0];
        var half = s('g', { 'class': cfg[1] });
        half.appendChild(s('path', { 'class': 'blade', d: halfPath(L.leafW, L.leafH, dir) }));
        [-0.3, 0, 0.3].forEach(function (f) {
          var vx = f * L.leafW;
          half.appendChild(s('line', { x1: vx, y1: 0, x2: vx + L.leafW * 0.12, y2: dir * L.leafH * 0.3, stroke: 'rgba(255,255,255,0.18)', 'stroke-width': '1' }));
        });
        inner.appendChild(half);
      });
      var label = s('text', { 'class': 'leaf-text', x: 0, y: 0, dy: '0.35em', 'text-anchor': 'middle', 'font-size': L.font });
      label.textContent = skill.short || skill.name;
      inner.appendChild(label);
      g.appendChild(inner);

      g.addEventListener('click', function () { showSkill(idx); });
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          showSkill(idx);
        }
      });
      svg.appendChild(g);
    });

    treeLayout = L;

    svg.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.closest && (t.closest('.leaf') || t.closest('.skill-panel'))) { return; }
      if (selectedSkill >= 0) { closeSkill(); }
    });

    host.appendChild(svg);
    if (selectedSkill >= 0) { openSkill(selectedSkill); }
  }

  function setupTree() {
    if (!document.getElementById('tree')) { return; }
    buildTree();
    closeSkill();
    srUpdate('Click a leaf to open it and read about the skill.');
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && selectedSkill >= 0) { closeSkill(); }
    });
    window.addEventListener('resize', function () {
      var mobile = window.innerWidth < 640;
      if (mobile !== lastMobile) { buildTree(); }
    });
  }

  /* ---------- contact form ---------- */
  function setupForm() {
    var form = document.getElementById('contact-form');
    if (!form) { return; }
    var nameInput = document.getElementById('f-name');
    var msgInput = document.getElementById('f-message');
    var nameErr = document.getElementById('f-name-error');
    var msgErr = document.getElementById('f-message-error');
    var status = document.getElementById('form-status');
    var waBtn = document.getElementById('send-whatsapp');

    function validate() {
      var ok = true;
      if (!nameInput.value.trim()) {
        nameErr.textContent = 'Enter your name';
        ok = false;
      } else {
        nameErr.textContent = '';
      }
      if (!msgInput.value.trim()) {
        msgErr.textContent = 'Write a short message';
        ok = false;
      } else {
        msgErr.textContent = '';
      }
      return ok;
    }

    nameInput.addEventListener('input', function () { nameErr.textContent = ''; });
    msgInput.addEventListener('input', function () { msgErr.textContent = ''; });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) { return; }
      var name = nameInput.value.trim();
      var message = msgInput.value.trim();
      var subject = 'Message from ' + name + ' (portfolio)';
      var body = message + '\n\n' + name;
      status.textContent = 'Opening Gmail\u2026';
      var win = window.open(gmailUrl(subject, body), '_blank');
      if (win) {
        try { win.opener = null; } catch (err) { /* ignore */ }
      } else {
        window.location.href = 'mailto:' + SITE.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
    });

    waBtn.addEventListener('click', function () {
      if (!validate()) { return; }
      var name = nameInput.value.trim();
      var message = msgInput.value.trim();
      var text = 'Hi ' + (SITE.name || '') + ', I am ' + name + '. ' + message;
      var number = (SITE.phone || '').replace(/\D/g, '');
      status.textContent = 'Opening WhatsApp\u2026';
      window.open('https://wa.me/' + number + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    });
  }

  /* ---------- start ---------- */
  function init() {
    buildHeader();
    buildFooter();
    fillFields();
    renderSocial();
    setupPhoto();
    setupResume();
    renderServices();
    renderProjects();
    setupTree();
    setupForm();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
